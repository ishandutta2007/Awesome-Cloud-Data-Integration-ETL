<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glassmorphism Card Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    
    /* Subtle Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .pulsing-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-flow {
      stroke-dasharray: 12 12;
      animation: flowDash 3s linear infinite;
    }
    .floating-card-1 {
      animation: floatNode 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatNode 7s ease-in-out infinite 1s;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Ambient Pulsing Glow Orbs (Background layer) -->
  <circle cx="200" cy="100" r="150" fill="url(#glowGrad)" class="pulsing-bg" />
  <circle cx="1000" cy="300" r="180" fill="url(#glowGrad)" class="pulsing-bg" />

  <!-- Background Data Flow Animations (Kept low opacity & behind text) -->
  <g stroke="url(#lineGrad)" stroke-width="2" fill="none">
    <path d="M 100 320 C 300 320, 350 280, 500 280 S 700 340, 900 340 S 1050 290, 1150 290" class="animated-flow" />
    <path d="M 50 120 C 200 120, 400 60, 650 60 S 900 100, 1100 100" class="animated-flow" opacity="0.5" />
  </g>

  <!-- Background Animated Data Node Cards (Subtle Glassmorphism, strictly behind text opacity) -->
  <g class="floating-card-1" opacity="0.25">
    <rect x="850" y="60" width="260" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="880" cy="95" r="12" fill="#38bdf8" opacity="0.8" />
    <rect x="905" y="85" width="120" height="8" rx="4" fill="#94a3b8" />
    <rect x="905" y="100" width="80" height="6" rx="3" fill="#64748b" />
  </g>

  <g class="floating-card-2" opacity="0.25">
    <rect x="880" y="240" width="240" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="910" cy="275" r="12" fill="#c084fc" opacity="0.8" />
    <rect x="935" y="265" width="110" height="8" rx="4" fill="#94a3b8" />
    <rect x="935" y="280" width="70" height="6" rx="3" fill="#64748b" />
  </g>

  <!-- Foreground Content Container (Guaranteed clear visibility) -->
  <g transform="translate(80, 0)">

    <!-- Category Pill Badge -->
    <g transform="translate(0, 85)">
      <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="36" y="22" class="badge-text">Awesome ETL &amp; Data Integration</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="185" class="title-text" filter="url(#glow)">
      Cloud Data Integration &amp; ETL
    </text>

    <!-- Subtitle -->
    <text x="0" y="230" class="subtitle-text">
      Curated SaaS Platforms, Open-Source ELT Engines &amp; Orchestrators
    </text>

    <!-- Feature Tag Chips in Foreground -->
    <g transform="translate(0, 275)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="16" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Managed ELT</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(142, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="16" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔓 Open-Source</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(299, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="16" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔄 Orchestration</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(466, 0)">
        <rect width="175" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="16" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 Schema Drift &amp; CDC</text>
      </g>
    </g>

  </g>
</svg>
